name: Bug Report
description: File a bug report
body:
  - type: markdown
    attributes:
      value: |
        #### Before You Start

        Make sure to look through [the docs](https://xl-docs.codepoems.eu) first.
        
        Write `N/A` if a field is unrelated to the problem.

        Well-described issues have a higher chance of being fixed.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you using? You will find it in the About tab. You should be using the latest version.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      description: What operating system are you using?
      options:
        - Windows
        - Linux
      default: 0
    validations:
      required: true
  
  - type: textarea
    id: bug-description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
    
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Write a step-by-step instruction on how to reproduce the issue.
    validations:
      required: true
    
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: Describe what should happen.
    validations:
      required: true
    
  - type: textarea
    id: what-happened
    attributes:
      label: Current Result
      description: Describe what happened instead.
    validations:
      required: true
    
  - type: input
    id: input-formats
    attributes:
      label: Input Formats
      description: What image formats are you converting from? They are listed in the Input tab.
      placeholder: PNG, JPEG
    validations:
      required: true
    
  - type: input
    id: output-format
    attributes:
      label: Selected Format / Mode
      description: The selected "Format / Mode" option, found in the Output tab.
      placeholder: JPEG XL, Lossless JPEG Transcoding etc.
    validations:
      required: true
    
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information (Optional)
      description: Include any other relevant information, such as error messages, or screenshots.
    validations:
      required: false
    
  - type: markdown
    attributes:
      value: |
        #### Attachments (Optional)

        You can share files (such as logs or images) alongside your issue.
        
        Logs can be generated in the settings -- Settings -> Advanced (at the very bottom) -> Start Logging.

        You can share files by uploading them to the "Additional Information" section above. However, this will make them publicly accessible.

        Alternatively, send them to my email. This is much more private.

        1. Upload your files to a file sharing service of your choice.
        2. Send me an email using the following template:

        ```txt
        Download link: 
        GitHub username: 
        GitHub issue title: 
        ```

        Email: contact@codepoems.eu
[package]
name = "jpeglic-converter"
version = "0.0.1"
description = "Easy-to-use image converter for home archives"
authors = ["Jpeglic Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["jpeg", "png", "avif", "webp", "bmp", "gif", "tiff", "ico"] }
kamadak-exif = "0.5"
trash = "5"
dirs = "6"
walkdir = "2"
thiserror = "2"
rayon = "1.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
num_cpus = "1"
base64 = "0.22"
filetime = "0.2"

jpegli-rs = "0.2.1"
img-parts = "0.4.0"
xmp-writer = "0.3.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
